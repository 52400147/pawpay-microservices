spring.application.name=billing-service
server.port=3003
spring.jpa.open-in-view=false

# === Database ===
# Dev: H2 in-memory (default)
spring.datasource.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Production: comment dòng H2 trên, uncomment MySQL dưới + set env vars
#spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:pawpay_billing}
#spring.datasource.username=${DB_USER:root}
#spring.datasource.password=${DB_PASS:}
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=update

# === JWT ===
# Khoá ký JWT dùng chung cả nhóm. Khi ghép nhóm, đặt biến môi trường JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-secret-doi-khi-ghep-nhom}
